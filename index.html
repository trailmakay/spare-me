<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0e1a">
<link rel="stylesheet" href="scenes.css">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="bowling-icon-180.png">
<link rel="icon" href="bowling-icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Spare Me">
<title>Spare Me — Bowling Scoreboard</title>
<style>
  :root{
    --lane:#e8b563;         /* maple lane wood */
    --lane-dark:#c8944a;
    --panel:#0b1020;
    --panel2:#141b33;
    --ink:#f4f6ff;
    --amber:#ffb020;
    --amber-glow:#ffd36e;
    --red:#e33b3b;
    --green:#33c06a;
    --blue:#2ea3ff;
    --line:#2a3358;
    --gold:#ffd166;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;overflow:hidden;}
  body{
    font-family:'Trebuchet MS','Segoe UI',system-ui,sans-serif;
    background:
      radial-gradient(1200px 600px at 50% -10%, #1a2450 0%, transparent 60%),
      linear-gradient(180deg,#0a0e1a 0%,#070a14 100%);
    color:var(--ink);
    user-select:none;-webkit-user-select:none;
    height:100dvh;display:flex;flex-direction:column;
  }
  .hidden{display:none!important;}

  /* ---------- Header ---------- */
  header{
    display:flex;align-items:center;gap:10px;flex-shrink:0;
    padding:calc(6px + env(safe-area-inset-top)) calc(14px + env(safe-area-inset-right))
            6px calc(14px + env(safe-area-inset-left));
    background:linear-gradient(180deg,rgba(21,29,58,.86),rgba(12,18,38,.86));
    border-bottom:2px solid var(--line);
    box-shadow:0 2px 12px rgba(0,0,0,.5);
  }
  .logo{
    font-weight:900;letter-spacing:1px;
    font-size:clamp(16px,2.6vw,26px);
    color:var(--amber);
    text-shadow:0 0 14px rgba(255,176,32,.55);
    display:flex;align-items:center;gap:8px;white-space:nowrap;
  }
  .pin-ico{font-size:1.1em;}
  header .spacer{flex:1;}
  .btn{
    background:linear-gradient(180deg,#26305a,#1a2140);
    color:var(--ink);border:1px solid var(--line);
    border-radius:10px;padding:9px 14px;font-weight:800;
    font-size:14px;cursor:pointer;transition:.12s;
  }
  .btn:active{transform:translateY(1px);}
  .btn.amber{background:linear-gradient(180deg,var(--amber),#e0951a);color:#241500;border-color:#8a5b00;}
  .btn.red{background:linear-gradient(180deg,#e94b4b,#b52d2d);border-color:#7a1c1c;color:#fff;}

  /* ---------- Setup screen ---------- */
  #setup{flex:1;min-height:0;overflow:auto;padding:16px 22px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;}
  .card{
    width:min(680px,100%);
    background:linear-gradient(180deg,rgba(20,27,51,.94),rgba(11,16,32,.94));
    border:1px solid var(--line);border-radius:16px;
    padding:16px 18px;margin:0;
    box-shadow:0 10px 40px rgba(0,0,0,.4);
  }
  .card h2{margin:0 0 10px;font-size:19px;color:var(--amber-glow);letter-spacing:.5px;}
  .team-row{
    display:flex;align-items:center;gap:10px;margin-bottom:8px;
    background:#0e1430;border:1px solid var(--line);border-radius:12px;padding:6px 10px;
  }
  .swatch{width:26px;height:26px;border-radius:7px;flex-shrink:0;box-shadow:0 0 0 2px rgba(255,255,255,.15) inset;}
  .team-row input{
    flex:1;background:transparent;border:none;color:var(--ink);
    font-size:17px;font-weight:700;padding:8px 4px;outline:none;
  }
  .team-row input::placeholder{color:#7480a8;}
  .del{
    background:none;border:none;cursor:pointer;flex-shrink:0;
    font-size:22px;padding:8px 10px;line-height:1;opacity:.75;transition:.12s;
  }
  .del:active{transform:translateY(1px);}
  .del:hover{opacity:1;}
  .row-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px;}
  .hint{color:#8894c0;font-size:13px;margin:2px 0 10px;}
  .big-start{
    width:100%;padding:14px;font-size:20px;border-radius:14px;
    background:linear-gradient(180deg,var(--green),#25a457);color:#04210f;
    border:1px solid #14612f;font-weight:900;letter-spacing:1px;cursor:pointer;
    box-shadow:0 6px 20px rgba(51,192,106,.35);
  }
  .big-start:active{transform:translateY(1px);}

  /* ---------- Scoreboard ---------- */
  #board{flex:1;display:flex;flex-direction:column;overflow:hidden;}
  .lanes{
    flex:1;min-height:0;overflow:auto;
    padding:8px calc(8px + env(safe-area-inset-right)) 8px calc(8px + env(safe-area-inset-left));
    display:flex;flex-direction:column;gap:8px;justify-content:center;
  }
  .lane{
    flex:0 0 auto;min-height:clamp(72px,20vh,120px);
    background:
      repeating-linear-gradient(90deg,rgba(232,181,99,.45) 0 38px,rgba(200,148,74,.45) 38px 40px);
    border-radius:12px;padding:5px;
    border:2px solid rgba(122,82,32,.85);
    box-shadow:0 6px 18px rgba(0,0,0,.5);
    position:relative;transition:box-shadow .25s;
  }
  .lane.active{
    box-shadow:0 0 0 3px var(--amber), 0 0 30px rgba(255,176,32,.5), 0 8px 24px rgba(0,0,0,.5);
  }
  .lane-inner{
    background:rgba(10,14,26,.5);border-radius:10px;height:100%;
    display:flex;align-items:stretch;overflow:hidden;border:1px solid rgba(0,0,0,.5);
  }
  .team-plate{
    flex-shrink:0;width:clamp(120px,16vw,190px);
    padding:8px 12px;display:flex;flex-direction:column;justify-content:center;gap:4px;
    border-right:2px solid #000;
  }
  .team-name{font-weight:900;font-size:clamp(14px,1.9vw,21px);line-height:1.1;letter-spacing:.3px;
    text-shadow:0 1px 2px rgba(0,0,0,.6);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .team-total{font-size:clamp(20px,3.6vw,42px);font-weight:900;line-height:1;
    font-family:'DS-Digital','Courier New',monospace;color:var(--amber);
    text-shadow:0 0 12px rgba(255,176,32,.6);}
  .lane.active .team-name{color:#fff;}

  .frames{display:flex;flex:1;min-width:0;}
  .frame{
    flex:1;min-width:0;border-right:1px solid #333a5c;
    display:flex;flex-direction:column;
  }
  .frame:last-child{border-right:none;}
  .frame.tenth{flex:1.35;}
  .frame-no{
    text-align:center;font-size:10px;font-weight:800;color:#aab4e0;
    background:rgba(10,16,36,.45);padding:2px 0;border-bottom:1px solid rgba(34,42,74,.6);letter-spacing:.5px;
  }
  .rolls{display:flex;height:clamp(18px,3vw,30px);flex-shrink:0;}
  .roll{
    flex:1;display:flex;align-items:center;justify-content:center;
    font-size:clamp(13px,1.9vw,20px);font-weight:800;color:var(--ink);
    border-left:1px solid #222a4a;
    font-family:'Courier New',monospace;
  }
  .roll:first-child{border-left:none;}
  .roll.mark{color:var(--amber-glow);}
  .frame-score{
    text-align:center;flex:1;display:flex;align-items:center;justify-content:center;
    font-size:clamp(15px,2.4vw,28px);font-weight:900;
    font-family:'Courier New',monospace;color:#fff;
    min-height:clamp(20px,3vw,34px);
    text-shadow:0 0 8px rgba(255,255,255,.25);
  }
  .frame.cur{background:rgba(255,176,32,.16);}

  /* ---------- Keypad ---------- */
  .keypad{
    background:linear-gradient(180deg,rgba(16,23,51,.62),rgba(10,14,28,.72));
    border-top:2px solid var(--line);flex-shrink:0;
    padding:6px calc(8px + env(safe-area-inset-right)) calc(6px + env(safe-area-inset-bottom))
            calc(8px + env(safe-area-inset-left));
    display:flex;flex-direction:column;gap:6px;
  }
  .keypad-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .now-up{font-size:13px;font-weight:800;color:#aeb8e0;}
  .now-up b{color:var(--amber-glow);}
  .keys{display:grid;grid-template-columns:repeat(11,1fr);gap:6px;}
  .keys.wide{grid-template-columns:repeat(6,1fr);}
  .key{
    padding:9px 0;border-radius:10px;font-size:clamp(15px,2.2vw,23px);font-weight:900;
    background:linear-gradient(180deg,rgba(35,44,82,.86),rgba(22,29,58,.9));color:var(--ink);
    border:1px solid rgba(120,135,190,.35);cursor:pointer;transition:.08s;text-align:center;
    box-shadow:0 3px 0 rgba(12,16,38,.7);text-shadow:0 1px 2px rgba(0,0,0,.5);
  }
  .key:active{transform:translateY(2px);box-shadow:0 1px 0 #0c1026;}
  .key.zero{background:linear-gradient(180deg,#2a3358,#1a2140);}
  .key.strike{background:linear-gradient(180deg,var(--red),#a82424);color:#fff;border-color:#7a1c1c;grid-column:span 1;}
  .key.spare{background:linear-gradient(180deg,var(--blue),#1668b0);color:#fff;border-color:#12507f;}
  .key.gutter{background:linear-gradient(180deg,#3a4266,#242b48);}
  .key.undo{background:linear-gradient(180deg,#4a3a12,#2e2408);color:var(--amber);border-color:#6b5416;}
  .key:disabled{opacity:.28;pointer-events:none;}

  /* ---------- Winner banner ---------- */
  #winner{
    position:fixed;inset:0;background:rgba(4,6,14,.92);z-index:60;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
    padding:20px;text-align:center;
  }
  #winner .trophy{font-size:80px;filter:drop-shadow(0 0 30px var(--gold));animation:bob 1.4s ease-in-out infinite;}
  #winner h1{margin:0;font-size:clamp(28px,7vw,64px);color:var(--gold);
    text-shadow:0 0 30px rgba(255,209,102,.7);letter-spacing:1px;}
  #winner .sub{font-size:20px;color:#c9d2f5;}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}

  /* ---------- Scene picker ---------- */
  #sceneModal{
    position:fixed;inset:0;z-index:70;background:rgba(4,6,14,.82);
    display:flex;align-items:center;justify-content:center;padding:18px;
  }
  .scene-sheet{
    width:min(760px,100%);max-height:92vh;display:flex;flex-direction:column;overflow:hidden;
    background:linear-gradient(180deg,var(--panel2),var(--panel));
    border:1px solid var(--line);border-radius:18px;padding:16px;
    box-shadow:0 20px 60px rgba(0,0,0,.6);
  }
  .scene-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-shrink:0;
    font-size:20px;font-weight:900;color:var(--amber-glow);letter-spacing:.5px;}
  .scene-close{background:none;border:none;color:#8894c0;font-size:22px;cursor:pointer;padding:4px 8px;}
  .scene-close:hover{color:var(--red);}
  .scene-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;
    overflow:auto;flex:1;min-height:0;padding:2px;}
  .scene-card{
    border-radius:12px;overflow:hidden;cursor:pointer;border:2px solid var(--line);
    background:#0b1020;transition:.12s;text-align:center;
  }
  .scene-card:active{transform:translateY(1px);}
  .scene-card.sel{border-color:var(--amber);box-shadow:0 0 0 2px var(--amber),0 0 18px rgba(255,176,32,.4);}
  .scene-thumb{height:72px;width:100%;}
  .scene-label{padding:8px 6px;font-weight:800;font-size:14px;color:var(--ink);}
  .scene-card.sel .scene-label{color:var(--amber-glow);}
  .scene-done{
    margin-top:12px;flex-shrink:0;width:100%;padding:13px;border-radius:12px;
    background:linear-gradient(180deg,var(--green),#25a457);color:#04210f;
    border:1px solid #14612f;font-weight:900;font-size:18px;letter-spacing:.5px;cursor:pointer;
    box-shadow:0 5px 16px rgba(51,192,106,.35);
  }
  .scene-done:active{transform:translateY(1px);}

  /* ---------- Strike explosion ---------- */
  #fx{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden;}
  .boom{
    position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);
    font-size:clamp(60px,16vw,180px);font-weight:900;letter-spacing:2px;
    animation:boomPop 1.1s ease-out forwards;
    text-shadow:0 0 40px currentColor;
  }
  .boom.strike-txt{color:var(--red);}
  .boom.spare-txt{color:var(--blue);}
  @keyframes boomPop{
    0%{transform:translate(-50%,-50%) scale(.2) rotate(-8deg);opacity:0;}
    18%{transform:translate(-50%,-50%) scale(1.25) rotate(4deg);opacity:1;}
    45%{transform:translate(-50%,-50%) scale(1) rotate(-2deg);opacity:1;}
    100%{transform:translate(-50%,-50%) scale(1.05) rotate(0);opacity:0;}
  }
  .spark{position:absolute;width:14px;height:14px;border-radius:3px;will-change:transform,opacity;}

  /* rotate hint on portrait phones */
  #rotate{
    position:fixed;inset:0;z-index:80;background:#070a14;color:var(--ink);
    display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:30px;
  }
  #rotate .ph{font-size:64px;animation:rot 2s ease-in-out infinite;}
  @keyframes rot{0%,100%{transform:rotate(0)}50%{transform:rotate(90deg)}}
  @media (max-width:820px) and (orientation:portrait){
    #board.playing ~ #rotate{display:flex;}
  }
</style>
</head>
<body>

<header>
  <div class="logo"><span class="pin-ico">🎳</span> SPARE ME</div>
  <div class="spacer"></div>
  <button class="btn" id="sceneBtn">🏞️ Scene</button>
  <button class="btn" id="fullBtn">⛶ Fullscreen</button>
  <button class="btn amber hidden" id="newBtn">↺ New Game</button>
</header>

<!-- ================= SETUP ================= -->
<section id="setup">
  <div class="card">
    <h2>🎳 Set Up Your Teams</h2>
    <p class="hint">Add each team (or player), name them, and tap Start.</p>
    <div id="teamList"></div>
    <div class="row-actions" style="margin-bottom:12px;">
      <button class="btn amber" id="addTeam">+ Add Team</button>
    </div>
    <button class="big-start" id="startBtn">🎳  START GAME  🎳</button>
    <p class="hint" style="text-align:center;margin:8px 0 0;">
      Tip: turn your phone sideways &amp; cast to the big screen for the full alley feel.
    </p>
  </div>
</section>

<!-- ================= BOARD ================= -->
<section id="board" class="hidden">
  <div class="lanes" id="lanes"></div>

  <div class="keypad">
    <div class="keypad-top">
      <div class="now-up">UP: <b id="upLabel">—</b> · Frame <b id="frameLabel">1</b> · <span id="ballLabel">Ball 1</span></div>
      <div class="spacer" style="flex:1"></div>
      <span class="now-up" id="pinsLeftLabel"></span>
    </div>
    <div class="keys" id="numKeys"></div>
    <div class="keys wide">
      <button class="key gutter" data-val="gutter">– (0)</button>
      <button class="key strike" data-val="strike" id="strikeKey">✖ STRIKE</button>
      <button class="key spare" data-val="spare" id="spareKey">／ SPARE</button>
      <button class="key undo" data-val="undo">↶ Undo</button>
    </div>
  </div>
</section>

<!-- scene picker -->
<div id="sceneModal" class="hidden">
  <div class="scene-sheet">
    <div class="scene-head">
      <span>🏞️ Pick Your Scene</span>
      <button class="scene-close" id="sceneClose">✕</button>
    </div>
    <div class="scene-grid" id="sceneGrid"></div>
    <button class="scene-done" id="sceneDone">✓ Done</button>
  </div>
</div>

<div id="fx"></div>

<!-- winner -->
<div id="winner" class="hidden">
  <div class="trophy">🏆</div>
  <h1 id="winName">Winner!</h1>
  <div class="sub" id="winScore"></div>
  <button class="btn amber" style="font-size:18px;padding:14px 26px;" id="winNew">Play Again</button>
</div>

<!-- rotate hint -->
<div id="rotate">
  <div class="ph">📱</div>
  <div style="font-size:22px;font-weight:800;">Rotate your phone sideways</div>
  <div style="color:#8894c0;">The scoreboard is built for landscape.</div>
</div>

<script>
/* ============================================================
   Human Bowling Scoreboard  — vanilla JS, standard 10-pin rules
   ============================================================ */
const TEAM_COLORS = ['#e33b3b','#2ea3ff','#33c06a','#ffb020','#b06bff','#ff6ba6','#25d0c0','#ff8a3d'];
const NAMES = ['Team 1','Team 2','Team 3','Team 4','Team 5','Team 6','Team 7','Team 8'];

let teams = [];      // {name,color}
let game = null;     // {teams:[{name,color,frames:[[..rolls]]}], turn, over}

/* ---------- Setup UI ---------- */
const teamList = document.getElementById('teamList');
function renderSetup(){
  teamList.innerHTML='';
  teams.forEach((t,i)=>{
    const row=document.createElement('div');
    row.className='team-row';
    row.innerHTML=`
      <span class="swatch" style="background:${t.color}"></span>
      <input value="${t.name.replace(/"/g,'&quot;')}" placeholder="Team name" maxlength="18" data-i="${i}">
      <button class="del" data-del="${i}" title="Remove team">🗑️</button>`;
    teamList.appendChild(row);
  });
}
function addTeam(){
  if(teams.length>=8) return;
  const i=teams.length;
  teams.push({name:NAMES[i],color:TEAM_COLORS[i%TEAM_COLORS.length]});
  renderSetup();
}
teamList.addEventListener('input',e=>{
  const i=e.target.dataset.i; if(i!=null) teams[i].name=e.target.value;
});
teamList.addEventListener('click',e=>{
  const d=e.target.dataset.del;
  if(d!=null){ teams.splice(+d,1); renderSetup(); }
});
document.getElementById('addTeam').onclick=addTeam;

// start with two teams
addTeam(); addTeam();

/* ---------- Start / New ---------- */
document.getElementById('startBtn').onclick=startGame;
document.getElementById('newBtn').onclick=()=>location.reload();
document.getElementById('winNew').onclick=()=>location.reload();

function startGame(){
  const t=teams.filter(x=>x.name.trim()).map(x=>({name:x.name.trim(),color:x.color,frames:[[]]}));
  if(!t.length){ alert('Add at least one team!'); return; }
  game={teams:t,turn:0,over:false};
  document.getElementById('setup').classList.add('hidden');
  const board=document.getElementById('board');
  board.classList.remove('hidden'); board.classList.add('playing');
  document.getElementById('newBtn').classList.remove('hidden');
  buildKeys();
  render();
}

/* ============================================================
   SCORING
   ============================================================ */
function isStrike(f){return f[0]===10;}
function isSpare(f){return f.length>=2 && f[0]!==10 && f[0]+f[1]===10;}

// cumulative scores for a team's frames; returns array len<=10 of running totals (null if not yet scorable)
function scoreTeam(frames){
  const totals=[]; let running=0;
  for(let i=0;i<10;i++){
    const f=frames[i];
    if(!f||f.length===0){totals.push(null);continue;}
    if(i<9){
      if(isStrike(f)){
        const b=strikeBonus(frames,i);
        if(b==null){totals.push(null);}
        else{running+=10+b;totals.push(running);}
      }else if(isSpare(f)){
        const b=spareBonus(frames,i);
        if(b==null){totals.push(null);}
        else{running+=10+b;totals.push(running);}
      }else{
        if(f.length<2){totals.push(null);}
        else{running+=f[0]+f[1];totals.push(running);}
      }
    }else{ // 10th frame
      const need=(f[0]===10||f[0]+f[1]===10)?3:2;
      if(f.length<need){totals.push(null);}
      else{running+=f.reduce((a,b)=>a+b,0);totals.push(running);}
    }
  }
  return totals;
}
function strikeBonus(frames,i){
  const next=frames[i+1];
  if(!next||next.length===0) return null;
  if(next[0]===10){ // need one more roll
    if(i+1===9){ return next.length>=2? 10+next[1] : null; }
    const n2=frames[i+2];
    if(!n2||n2.length===0) return null;
    return 10+n2[0];
  }
  return next.length>=2 ? next[0]+next[1] : null;
}
function spareBonus(frames,i){
  const next=frames[i+1];
  if(!next||next.length===0) return null;
  return next[0];
}
function teamTotal(frames){
  const t=scoreTeam(frames);
  for(let i=t.length-1;i>=0;i--) if(t[i]!=null) return t[i];
  return 0;
}

/* pins already down in the current (in-progress) frame of a team */
function pinsThisFrame(f,frameIdx){
  if(frameIdx<9){
    return f.length===1 && f[0]!==10 ? f[0] : 0;
  }
  // 10th
  let sum=0, avail=10;
  for(const r of f){ sum+=r; if(sum%10===0){sum=0;} } // reset after each fill of 10
  // compute remaining for the NEXT ball
  return remaining10(f);
}
function remaining10(f){
  // returns pins standing for the next ball in 10th frame
  if(f.length===0) return 10;
  if(f.length===1){ return f[0]===10?10:10-f[0]; }
  if(f.length===2){
    if(f[0]===10){ return f[1]===10?10:10-f[1]; } // after strike, ball2
    if(f[0]+f[1]===10){ return 10; } // spare -> fresh rack
    return 0; // open, done
  }
  return 0;
}

/* ============================================================
   INPUT
   ============================================================ */
function curTeam(){return game.teams[game.turn];}
function curFrameIdx(t){
  // index of the frame currently being filled
  for(let i=0;i<10;i++){ if(!frameComplete(t.frames,i)) return i; }
  return 9;
}
function frameComplete(frames,i){
  const f=frames[i]; if(!f) return false;
  if(i<9){ return isStrike(f) || f.length>=2; }
  // 10th
  if(f.length<2) return false;
  if(f[0]===10 || f[0]+f[1]===10) return f.length>=3;
  return f.length>=2;
}
function teamDone(frames){ return frameComplete(frames,9); }

function pinsAvailable(){
  const t=curTeam(); const fi=curFrameIdx(t);
  const f=t.frames[fi]||[];
  if(fi<9){
    if(f.length===0) return 10;
    return 10-f[0]; // second ball
  }
  return remaining10(f);
}

function roll(pins){
  if(game.over) return;
  const t=curTeam(); let fi=curFrameIdx(t);
  if(!t.frames[fi]) t.frames[fi]=[];
  const f=t.frames[fi];
  const avail=pinsAvailable();
  if(pins>avail) pins=avail; // safety clamp
  f.push(pins);

  // fx
  if(fi<9){
    if(f.length===1 && pins===10) boom('strike');
    else if(f.length===2 && f[0]+f[1]===10 && f[0]!==10) boom('spare');
  }else{
    if(pins===10) boom('strike');
    else if(f.length>=2){
      const a=f[f.length-2],b=f[f.length-1];
      if(a!==10 && a+b===10) boom('spare');
    }
  }

  advanceIfNeeded();
  render();
}

function advanceIfNeeded(){
  const t=curTeam();
  if(teamDone(t.frames)){
    // move to next team not done, else game over
    if(game.teams.every(tm=>teamDone(tm.frames))){ endGame(); return; }
    nextTurn();
  }else{
    const fi=curFrameIdx(t);
    // if frame just completed, move to next team (rotating turns per frame)
    if(frameComplete(t.frames,fi-0) && (t.frames[fi]===undefined || t.frames[fi].length===0)){
      // handled below
    }
    // Turn rotation: after a team completes a FRAME, pass to next team
    if(justCompletedFrame(t)){
      if(!game.teams.every(tm=>teamDone(tm.frames))) nextTurn();
    }
  }
}
function justCompletedFrame(t){
  // find highest completed frame index
  let done=-1;
  for(let i=0;i<10;i++){ if(frameComplete(t.frames,i)) done=i; else break; }
  // ensure there's an empty slot ready for next frame
  if(done>=0 && done<9 && (!t.frames[done+1])) t.frames[done+1]=[];
  return t._lastDone!==done ? (t._lastDone=done, done>=0) : false;
}
function nextTurn(){
  let n=game.turn;
  for(let k=0;k<game.teams.length;k++){
    n=(n+1)%game.teams.length;
    if(!teamDone(game.teams[n].frames)){ game.turn=n; return; }
  }
  game.turn=n;
}

function undo(){
  if(game.over){ document.getElementById('winner').classList.add('hidden'); game.over=false; }
  // find the most recently added roll across the natural order:
  // simplest: undo last roll of current team; if none, step back a team.
  let tries=game.teams.length+1;
  let idx=game.turn;
  while(tries-->0){
    const t=game.teams[idx];
    // last non-empty frame with rolls
    for(let i=9;i>=0;i--){
      if(t.frames[i] && t.frames[i].length>0){
        t.frames[i].pop();
        if(t.frames[i].length===0 && i>0 && i<10) t.frames.length=i+ (t.frames[i]?1:0);
        t._lastDone=undefined;
        game.turn=idx;
        // clean trailing empties
        while(t.frames.length>1 && t.frames[t.frames.length-1].length===0 && t.frames.length-1>i) t.frames.pop();
        render(); return;
      }
    }
    idx=(idx-1+game.teams.length)%game.teams.length;
  }
}

/* ============================================================
   RENDER
   ============================================================ */
function render(){
  const lanes=document.getElementById('lanes');
  lanes.innerHTML='';
  game.teams.forEach((t,ti)=>{
    const totals=scoreTeam(t.frames);
    const active=ti===game.turn && !game.over;
    const curFi=curFrameIdx(t);
    const lane=document.createElement('div');
    lane.className='lane'+(active?' active':'');
    let framesHtml='';
    for(let i=0;i<10;i++){
      const f=t.frames[i]||[];
      const isCur=active && i===curFi;
      framesHtml+=`<div class="frame ${i===9?'tenth':''} ${isCur?'cur':''}">
        <div class="frame-no">${i+1}</div>
        <div class="rolls">${rollCells(f,i)}</div>
        <div class="frame-score">${totals[i]!=null?totals[i]:''}</div>
      </div>`;
    }
    lane.innerHTML=`
      <div class="lane-inner">
        <div class="team-plate" style="background:linear-gradient(180deg,${t.color}cc,${t.color}77);">
          <div class="team-name">${active?'▶ ':''}${escapeHtml(t.name)}</div>
          <div class="team-total">${teamTotal(t.frames)}</div>
        </div>
        <div class="frames">${framesHtml}</div>
      </div>`;
    lanes.appendChild(lane);
  });

  // keypad status
  const t=curTeam();
  document.getElementById('upLabel').textContent=t?t.name:'—';
  const fi=t?curFrameIdx(t):0;
  document.getElementById('frameLabel').textContent=(fi+1);
  const f=t?(t.frames[fi]||[]):[];
  let ball=1;
  if(fi<9){ ball=f.length+1; }
  else{ ball=f.length+1; }
  document.getElementById('ballLabel').textContent='Ball '+ball;
  const avail=pinsAvailable();
  document.getElementById('pinsLeftLabel').textContent=game.over?'':(avail+' pins standing');

  updateKeys(avail);
}

function rollCells(f,i){
  if(i<9){
    let c1='',c2='';
    if(f.length>=1){ c1 = f[0]===10?'':(f[0]===0?'-':f[0]); }
    if(f[0]===10){ // strike shows in 2nd box conventionally
      return `<div class="roll"></div><div class="roll mark">X</div>`;
    }
    if(f.length>=2){
      c2 = (f[0]+f[1]===10)?'<span class="mark">/</span>':(f[1]===0?'-':f[1]);
    }
    return `<div class="roll">${c1}</div><div class="roll">${c2}</div>`;
  }
  // tenth: up to 3
  let cells=['','',''];
  let prev=0;
  for(let k=0;k<f.length;k++){
    const v=f[k];
    if(v===10) cells[k]='<span class="mark">X</span>';
    else if(k>0 && f[k-1]!==10 && prev+v===10 && !(f[k-1]===10)) cells[k]='<span class="mark">/</span>';
    else if(k>0 && f[k-1]===10) cells[k]=(v===0?'-':v); // after a strike fresh
    else cells[k]=(v===0?'-':v);
    // spare detection reset
    prev=(v===10|| (k>0&&prev+v===10))?0:v;
    if(f[k-1]===10) prev=v;
  }
  return cells.map(c=>`<div class="roll">${c}</div>`).join('');
}

/* ============================================================
   KEYPAD
   ============================================================ */
function buildKeys(){
  const nk=document.getElementById('numKeys');
  nk.innerHTML='';
  for(let n=0;n<=9;n++){
    const b=document.createElement('button');
    b.className='key'+(n===0?' zero':'');
    b.textContent=n; b.dataset.num=n;
    b.onclick=()=>roll(n);
    nk.appendChild(b);
  }
  // strike as 10 in the numeric strip? we already have big strike button; add a 10 slot as strike shortcut
  const b=document.createElement('button');
  b.className='key strike'; b.textContent='X'; b.dataset.num=10;
  b.onclick=()=>roll(10);
  nk.appendChild(b);

  document.querySelectorAll('.keys.wide .key').forEach(k=>{
    k.onclick=()=>{
      const v=k.dataset.val;
      if(v==='gutter') roll(0);
      else if(v==='strike') roll(10);
      else if(v==='spare') doSpare();
      else if(v==='undo') undo();
    };
  });
}
function doSpare(){
  const avail=pinsAvailable();
  roll(avail); // fill remaining pins = spare
}
function updateKeys(avail){
  document.querySelectorAll('#numKeys .key').forEach(k=>{
    const n=+k.dataset.num;
    k.disabled = game.over || n>avail;
  });
  const canStrike = !game.over && avail===10;
  document.getElementById('strikeKey').disabled=!canStrike;
  // spare only valid mid-frame when pins already knocked (avail<10) and not first ball fresh
  const t=curTeam(); const fi=t?curFrameIdx(t):0; const f=t?(t.frames[fi]||[]):[];
  let canSpare=false;
  if(!game.over){
    if(fi<9) canSpare = f.length===1 && f[0]!==10;
    else canSpare = f.length>0 && avail>0 && avail<10;
  }
  document.getElementById('spareKey').disabled=!canSpare;
}

/* ============================================================
   FX — strike/spare explosion
   ============================================================ */
function boom(type){
  const fx=document.getElementById('fx');
  const el=document.createElement('div');
  el.className='boom '+(type==='strike'?'strike-txt':'spare-txt');
  el.textContent=type==='strike'?'STRIKE!':'SPARE!';
  fx.appendChild(el);
  // sparks
  const colors=type==='strike'?['#ff5252','#ffb020','#ffd36e','#fff']:['#2ea3ff','#7fd0ff','#fff','#a0f'];
  const cx=window.innerWidth/2, cy=window.innerHeight*0.44;
  const count=type==='strike'?34:22;
  for(let i=0;i<count;i++){
    const s=document.createElement('div');
    s.className='spark';
    s.style.left=cx+'px'; s.style.top=cy+'px';
    s.style.background=colors[i%colors.length];
    fx.appendChild(s);
    const ang=Math.random()*Math.PI*2;
    const dist=80+Math.random()*260;
    const dx=Math.cos(ang)*dist, dy=Math.sin(ang)*dist;
    s.animate([
      {transform:'translate(0,0) scale(1)',opacity:1},
      {transform:`translate(${dx}px,${dy}px) scale(0)`,opacity:0}
    ],{duration:700+Math.random()*500,easing:'cubic-bezier(.2,.6,.2,1)'});
    setTimeout(()=>s.remove(),1300);
  }
  if(navigator.vibrate) navigator.vibrate(type==='strike'?[40,30,60]:35);
  setTimeout(()=>el.remove(),1200);
}

/* ============================================================
   END GAME
   ============================================================ */
function endGame(){
  game.over=true;
  render();
  let best=-1,winners=[];
  game.teams.forEach(t=>{
    const s=teamTotal(t.frames);
    if(s>best){best=s;winners=[t];}
    else if(s===best) winners.push(t);
  });
  const w=document.getElementById('winner');
  document.getElementById('winName').textContent=
    winners.length>1?'It\'s a Tie!':winners[0].name+' Wins!';
  document.getElementById('winScore').textContent=
    winners.map(t=>t.name+': '+teamTotal(t.frames)).join('   ·   ');
  w.classList.remove('hidden');
  // celebratory bursts
  let n=0;const iv=setInterval(()=>{boom(n%2?'spare':'strike');if(++n>4)clearInterval(iv);},400);
}

/* ---------- helpers ---------- */
function escapeHtml(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

/* ---------- fullscreen ---------- */
document.getElementById('fullBtn').onclick=()=>{
  const el=document.documentElement;
  if(!document.fullscreenElement){ (el.requestFullscreen||el.webkitRequestFullscreen).call(el); }
  else{ (document.exitFullscreen||document.webkitExitFullscreen).call(document); }
};

/* keyboard support for big-screen w/ keyboard */
window.addEventListener('keydown',e=>{
  if(!game||game.over) return;
  if(e.key>='0'&&e.key<='9'){ const n=+e.key; if(n<=pinsAvailable()) roll(n); }
  else if(e.key==='x'||e.key==='X'){ if(pinsAvailable()===10) roll(10); }
  else if(e.key==='/'){ if(!document.getElementById('spareKey').disabled) doSpare(); }
  else if(e.key==='Backspace'){ e.preventDefault(); undo(); }
});

/* ---------- scene picker ---------- */
const SCENES=[
  {id:'classic',name:'Classic Alley'},
  {id:'powell', name:'Lake Powell'},
  {id:'jungle', name:'Jungle'},
  {id:'sunset', name:'Sunset Beach'},
  {id:'neon',   name:'Neon Night'},
  {id:'snow',   name:'Snowy Peaks'},
  {id:'space',  name:'Outer Space'},
  {id:'city',   name:'City Skyline'}
];
function applyScene(id){
  document.body.setAttribute('data-theme',id);
  try{localStorage.setItem('spareme-scene',id);}catch(e){}
}
function buildSceneGrid(){
  const cur=document.body.getAttribute('data-theme')||'classic';
  const g=document.getElementById('sceneGrid');
  g.innerHTML='';
  SCENES.forEach(s=>{
    const c=document.createElement('div');
    c.className='scene-card'+(s.id===cur?' sel':'');
    c.innerHTML=`<div class="scene-thumb" data-scene="${s.id}"></div><div class="scene-label">${s.name}</div>`;
    c.onclick=()=>{ applyScene(s.id); buildSceneGrid(); };
    g.appendChild(c);
  });
}
document.getElementById('sceneBtn').onclick=()=>{
  buildSceneGrid();
  document.getElementById('sceneModal').classList.remove('hidden');
};
const closeScene=()=>document.getElementById('sceneModal').classList.add('hidden');
document.getElementById('sceneClose').onclick=closeScene;
document.getElementById('sceneDone').onclick=closeScene;
document.getElementById('sceneModal').addEventListener('click',e=>{
  if(e.target.id==='sceneModal') e.target.classList.add('hidden');
});
// restore saved scene
applyScene((()=>{try{return localStorage.getItem('spareme-scene')||'classic';}catch(e){return 'classic';}})());

/* ---------- offline / installable (web PWA only; skipped inside native app) ---------- */
if('serviceWorker' in navigator && !window.Capacitor){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('bowling-sw.js').catch(()=>{});
  });
}
